name: Bug
description: Something is broken
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version (the release tag, or /healthz on the Pi)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redact tokens and personal data)
      render: text
