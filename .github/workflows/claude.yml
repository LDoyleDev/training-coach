# Claude responds to "@claude" in issues and PR comments. Only the repo owner can trigger it
# (author_association == OWNER), so text from anyone else never reaches the model.
# Auth: repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`), which uses the
# owner's Claude subscription. See ADR-0011 and docs/security/threat-model.md.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    env:
      # Skips cleanly until the CLAUDE_CODE_OAUTH_TOKEN secret is added (docs/runbooks/github-setup.md).
      CLAUDE_TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    timeout-minutes: 45
    steps:
      - if: env.CLAUDE_TOKEN_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - if: env.CLAUDE_TOKEN_SET == 'true'
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The owner's rule (CLAUDE.md): no AI attribution in commits, PRs or comments.
          claude_args: |
            --append-system-prompt "Never add attribution: no Co-Authored-By or Claude-Session trailers, no 'Generated with Claude Code' footers, no claude.ai or session links."
