name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - name: Domain coverage is 100%
        run: uv run coverage report --include='*/training_coach/domain/*' --fail-under=100
      - name: Migrations have no pending model changes
        env:
          TC_DATABASE_URL: sqlite:///./ci.db
        run: uv run alembic upgrade head && uv run alembic check

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: API types match the FastAPI schema
        working-directory: .
        run: cd backend && uv sync --frozen && cd .. && make api-types-check

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose .
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: pip-audit
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    # Builds natively on amd64 to prove the Dockerfile works; the Pi builds its own arm64 image.
    name: Docker image builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # the image scan's results, in the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Base images and the Dockerfile frontend through Google's Docker Hub mirror: shared
      # runners hit Docker Hub's anonymous pull limit (429) often enough to block merges. Set as
      # a registry mirror on the runner's Docker, so the Dockerfile keeps literal image names
      # that Dependabot can read (review of #174).
      - name: Use Google's Docker Hub mirror
        run: |
          config=/etc/docker/daemon.json
          [ -f "$config" ] || echo '{}' | sudo tee "$config" >/dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$config" |
            sudo tee "$config.new" >/dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io
      - run: >-
          docker build -t training-coach:ci
          --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile:1.7
          .
      # Known high and critical vulnerabilities with a fix, in the image's OS packages and
      # libraries. Reported in the Security tab, not blocking: a fix Debian ships before the base
      # image does would otherwise stop every PR until Dependabot's monthly digest bump. The scan
      # itself can't fail the job either: it downloads Trivy and its database from ghcr.io,
      # which shared runners can be rate-limited on (review of #174); the run on main reports.
      - name: Scan the image
        continue-on-error: true
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"
          ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --format sarif --output /out/trivy.sarif
          --severity HIGH,CRITICAL --ignore-unfixed training-coach:ci
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # Only when the scan wrote a report. Dependabot's PRs get a read-only token, so the
        # upload can fail there; the scan on main reports for them.
        if: hashFiles('trivy.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy
