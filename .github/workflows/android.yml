# The band reader in android/ (ADR-0070). Builds, tests and lints it whenever it changes; on main,
# when android/VERSION moved, signs the APK and publishes it as a pre-release android-v<version>
# for Obtainium. Not a required check: PRs that don't touch android/ skip it.
#
# The signing key never meets Gradle (security review of 2026-10-24): the build job, which runs
# every plugin and library, makes an unsigned APK with no secrets; the release job only signs it
# with apksigner, checks the signer and publishes.
name: Android reader

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.14.4"
      - name: Test, lint and build
        run: gradle -p android --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Check what the APK declares
        # The release APK at the path the release job takes it from: package, minSdk, targetSdk and
        # permissions must match android/app/expected-apk.txt, and versionCode must follow
        # android/VERSION. Catches a toolchain or library update that changes what the phone sees.
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk" || { echo "::error::no APK at $apk"; exit 1; }
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          "$tools/aapt2" dump permissions "$apk" > "$RUNNER_TEMP/permissions.txt"
          {
            sed -nE "s/^package: name='([^']*)'.*/package: \1/p" "$RUNNER_TEMP/badging.txt"
            sed -nE "s/^(minSdkVersion|sdkVersion): ?'([^']*)'.*/minSdk: \2/p" "$RUNNER_TEMP/badging.txt"
            sed -nE "s/^targetSdkVersion: ?'([^']*)'.*/targetSdk: \1/p" "$RUNNER_TEMP/badging.txt"
            grep -E '^(uses-permission|permission):' "$RUNNER_TEMP/permissions.txt" | LC_ALL=C sort
          } > "$RUNNER_TEMP/apk.txt"
          grep -v '^#' android/app/expected-apk.txt | diff -u - "$RUNNER_TEMP/apk.txt" ||
            { grep -iE '^(package|[a-z]*sdk[a-z]*):' "$RUNNER_TEMP/badging.txt"; exit 1; }
          IFS=. read -r major minor patch < <(tr -d '[:space:]' < android/VERSION)
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          grep -q "^package: .* versionCode='$code' " "$RUNNER_TEMP/badging.txt" ||
            { echo "::error::versionCode is not $code (android/VERSION)"; grep '^package:' "$RUNNER_TEMP/badging.txt"; exit 1; }
          echo "APK checked: $(grep '^package:' "$RUNNER_TEMP/badging.txt")"
      - name: Keep the unsigned release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30 # a release can wait on approval for days; the job waits up to 30
      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: android/app/build/reports/
          retention-days: 7

  version:
    # Whether this push to main needs a release: android/VERSION has no pre-release yet.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < android/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "android-v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    # The signing key lives only in this environment, which needs Liam's approval per run. No
    # Gradle and no project code runs here: only apksigner from the runner's Android SDK.
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-release
    # Two pushes that both move VERSION would race between the check and the create.
    concurrency:
      group: android-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: android/SIGNING_CERT_SHA256
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          "$tools/zipalign" -p -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias tc-reader \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out signed.apk "$RUNNER_TEMP/aligned.apk"
      - name: Check the signature
        # Signed with the one key phones already trust: its certificate digest is pinned in the repo.
        run: |
          expected=$(tr -d '[:space:]' < android/SIGNING_CERT_SHA256)
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner"
          "$signer" verify --print-certs signed.apk | grep -q "certificate SHA-256 digest: $expected"
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv signed.apk "tc-reader-$VERSION.apk"
          gh release create "android-v$VERSION" "tc-reader-$VERSION.apk" -R "$GITHUB_REPOSITORY" \
            --prerelease --latest=false --target "$GITHUB_SHA" --title "Coach reader $VERSION" \
            --notes "The band reader (ADR-0070). Signing certificate SHA-256: $(cat android/SIGNING_CERT_SHA256). Install or update with Obtainium."
