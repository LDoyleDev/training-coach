# Automatic Claude review on every PR the owner opens (not drafts, never forks).
# Runs as plain `pull_request` (no secrets for forks); never use pull_request_target here.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER' &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    env:
      # Skips cleanly until the CLAUDE_CODE_OAUTH_TOKEN secret is added (docs/runbooks/github-setup.md).
      CLAUDE_TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    timeout-minutes: 20
    steps:
      - if: env.CLAUDE_TOKEN_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - if: env.CLAUDE_TOKEN_SET == 'true'
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against CLAUDE.md and docs/security/threat-model.md.
            Focus, in order: correctness bugs, security (secrets, auth, owner-only checks,
            LLM output treated as untrusted data), missing tests, migration safety,
            and violations of accepted ADRs in docs/adr/. Skip style nits that ruff,
            prettier or oxlint already enforce.

            Leave inline comments on specific lines with
            mcp__github_inline_comment__create_inline_comment, then one short summary
            comment with `gh pr comment`. If there is nothing important, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
