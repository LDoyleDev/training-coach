version: 2
updates:
  # Major upgrades are deliberate decisions (ADR + PR), not weekly bot PRs.
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: build, include: scope }

  # The band reader (ADR-0070): its Gradle plugins and libraries.
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    # init, analyze and upload-sarif must share a version, or the analyze step fails.
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
    commit-message: { prefix: ci }

  # Python and Node versions are pinned by ADR-0002/0004; only patch-level image updates.
  # By update type: version ranges don't match suffixed tags like 3.14-slim (#260, #261).
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: build }
