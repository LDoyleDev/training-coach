# ---------------------------------------------------------------- entry exercises (ADR-0083)
# For people starting low: older, untrained or heavier people, or anyone not yet at the bottom
# steps above (docs/specs/any-level-any-time.md, "B2-B3 revised after the evals"). Each is a
# movement the catalogue didn't have; where a low step is the same movement as a ladder above,
# it extends that ladder instead (#508). No session uses them yet (sessions are shared until
# builder step 5, ADR-0073), so each gives the `range` a session would: 3-10 reps where the
# ladder starts at level 1, so a frail person can't miss the bottom on day one. Water bottles and
# a bag need no kit; bands and kettlebells do (ADR-0071).

[[exercises]]
slug = "glute-bridge"
name = "Glute bridge"
summary = "Squeeze your glutes to drive your hips forward, then lower slowly. Standing, take a straight leg back; on the floor, lie on your back, knees bent, and lift until knees, hips and shoulders line up."
kind = "reps"
muscles = { glutes = 1, hamstrings = 0.5 }
pattern = "hinge"
aliases = ["bridge", "bridges", "glute bridges", "hip extension", "hip extensions"]
start = 0
ladder = ["Standing, at the counter", "On the floor", "On the floor, 3 s hold at the top", "Shoulders on the sofa (hip thrust)", "Single leg, on the floor", "Single leg, shoulders on the sofa"]
failure_ok = true
[exercises.cues]
"Standing, at the counter" = "Hands on the counter, leaning forward a little. Take one straight leg back from the hip, squeeze, and lower; don't arch your back. Each leg."
"On the floor, 3 s hold at the top" = "Squeeze for three seconds at the top, ribs down, then lower slowly."
"Shoulders on the sofa (hip thrust)" = "Sit on the floor, upper back against the front of the sofa, knees bent. Drive your hips up level with your knees, chin tucked."
"Single leg, on the floor" = "One foot down, the other leg straight in line with the thigh; keep the hips level."
"Single leg, shoulders on the sofa" = "Shoulders on the sofa, one foot down; don't let the hip on the free side drop."
[exercises.questions]
"On the floor" = "Can you lie on your back on the floor, do 8 glute bridges and get up again?"
"On the floor, 3 s hold at the top" = "Can you do 8 glute bridges on the floor, holding each one at the top for three seconds?"
"Shoulders on the sofa (hip thrust)" = "Can you do 8 hip thrusts with your shoulders on the sofa, hips up level with your knees?"
"Single leg, on the floor" = "Can you do 8 single-leg glute bridges on each leg, hips level?"
"Single leg, shoulders on the sofa" = "Can you do 8 single-leg hip thrusts on each leg, shoulders on the sofa?"
[exercises.levels]
"Standing, at the counter" = 1
"On the floor" = 2
"On the floor, 3 s hold at the top" = 2
"Shoulders on the sofa (hip thrust)" = 3
"Single leg, on the floor" = 4
"Single leg, shoulders on the sofa" = 5
[exercises.marks]
"On the floor" = ["floor"]
"On the floor, 3 s hold at the top" = ["floor"]
"Shoulders on the sofa (hip thrust)" = ["floor"]
"Single leg, on the floor" = ["floor"]
"Single leg, shoulders on the sofa" = ["floor"]

