slug = "plank"
name = "Plank"
summary = "Hands under your shoulders, body in one straight line from head to heels, and hold. Squeeze your glutes and brace as if about to cough; stop when your hips sag or your back aches."
kind = "seconds"
muscles = { abs = 1, obliques = 0.5 }
