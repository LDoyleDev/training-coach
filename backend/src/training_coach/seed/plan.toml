"Hands on a table" = "A sturdy table that can't slide: lower than the counter, so your arms take more of your weight."
"Hands on a chair seat against a wall" = "Back the chair against a wall so it can't move."
"On the knees" = "Hands on the floor under your shoulders, a cushion under the knees; a straight line from knees to head."
"Full plank" = "Hands under your shoulders, feet hip-width, on your toes."
"Full plank, arm reach" = "Reach one arm forward for a second, then the other, without the hips rocking. Feet wider is easier."
