# ---------------------------------------------------------------- sessions (queue order)
# A range counted in reps tops out at 18 (ADR-0078): at 18 on every set, twice, the next step is
# due. Calf raise, tibialis raise, kettlebell swing and band face pull are high-rep work and keep
# theirs. A test holds every range to this.
#
# `gym` is a session's gym version (ADR-0071), chosen on Today by someone who trains at both: the
# same focus and about the same sets for each muscle, from the gym catalogue below, with the
# home exercises a gym does no better (tibialis raise, neck work, the Copenhagen plank, carries).
# A session without one is done the same way at the gym. Loaded exercises climb within their
# range and then take the next weight (ADR-0072). The choices and reasons are in
# docs/specs/program-builder.md (Gym versions).
#
# `away` is its no-equipment version (ADR-0086), for a hotel room: bodyweight and what any room
# has (the floor, a chair, a bed, a wall, a door frame, a towel), never bands, bells, bars or a
# backpack. The same exercises where they have steps that need no kit, so levels and history
# carry over; away trains the highest step at or below the level that needs none. Every away
# exercise starts with a kit-free step (the seed holds it). The choices and reasons are in
# docs/specs/program-builder.md (M. Away versions).

