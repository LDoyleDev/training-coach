# ---------------------------------------------------------------- stretches (#98, ADR-0032)
# Offered after a resistance session (10, 20 or 30 min). Static holds of about 30 s at a gentle
# effort, 3-4 out of 10: a stretch, never pain. `muscles` use the exercises' muscle groups, so
# the routine can start with what the session worked. No equipment beyond a wall, door or chair.

[[stretches]]
slug = "standing-quad"
name = "Standing quad stretch"
muscles = ["quads", "hip flexors"]
per_side = true
cue = "Heel towards your glute, knees together, tuck the pelvis under. Hold a wall for balance."

[[stretches]]
slug = "half-kneeling-hip-flexor"
name = "Half-kneeling hip flexor stretch"
muscles = ["hip flexors", "quads"]
per_side = true
cue = "Back knee down, squeeze that glute and shift forward until the front of the hip stretches."

[[stretches]]
slug = "seated-hamstring"
name = "Seated hamstring stretch"
muscles = ["hamstrings", "lower back"]
per_side = true
cue = "One leg straight, the other foot against its thigh. Hinge from the hips, back long."

[[stretches]]
slug = "figure-four"
name = "Figure-four glute stretch"
muscles = ["glutes"]
per_side = true
cue = "On your back, ankle over the opposite knee, pull that thigh towards your chest."

[[stretches]]
slug = "wall-calf"
name = "Wall calf stretch"
muscles = ["calves"]
per_side = true
cue = "Hands on the wall, back leg straight and heel down. Bend that knee for the second half."

[[stretches]]
