# Training plan seed. Loaded by `training-coach seed`.
# Order of [[sessions]] is the queue order (ADR-0006). Ladders run easiest -> hardest;
# `start` is the ladder position (0-based) to begin at. Add new steps at the end of a ladder:
# steps are matched by position, and a step with history can only change name through
# `renames = { "old" = "new" }` on its exercise (the seed refuses anything else). A step below
# or between existing ones needs a migration that moves the ladder up first, as
# 5ebed72122f7 did for ADR-0083's lower steps (and moves `start` here by the same number).
#
# Structure follows Huberman's Foundational Fitness Protocol (Huberman Lab ep. 94, with
# Andy Galpin; see docs/specs/training-plan.md): 3 resistance days (legs; torso + neck;
# arms + a second, smaller leg block), 3 conditioning days (long zone 2; moderate ~35 min; high
# intensity, the moderate one followed by a core + hips block), 1 recovery day that also carries
# the light core, grip and neck side work. Every main muscle gets 10+ hard sets on two or more
# days (program-builder-research.md). Order within a session: power -> strength -> hypertrophy
# -> small muscles (Galpin). Each resistance session
# starts with a ~5 min warm-up and stays within ~60 min of work.
# `pair = N` on two neighbouring items: they are done alternately, set by set, and should not
# compete for the same muscles, so one rests while the other works. The order above applies to
# each pair's first exercise; the second may be a small muscle filling that lift's rest (ADR-0031).
# Each exercise's catalogue facts (ADR-0064): `muscles` from the fixed list, with what a hard set
# counts for each (1 prime mover, 0.5 synergist, 0.25 a small part; a stabiliser is left out),
# from docs/specs/program-builder-research.md; `qualities` that aren't muscles; its `pattern`;
# the `stress` it shares with other exercises (spine, grip); and under `[exercises.needs]`, the
# kit each ladder step needs ("kettlebell:16", "backpack:10", "band:medium": that band or a
# stronger one). Bodyweight and household things need nothing. `[exercises.cues]` gives a step
# its cue, shown with the ladder; the seed rewrites cues on every run (ADR-0071).
# `[exercises.questions]` asks "Can you do ...?" of every step after the first: a yes means the
# person can start at that step. It asks for the bottom of the step's range in one set, in good
# form (each side when one-sided), the first target a step with no history gets (ADR-0027);
# HIIT's steps name their rounds, so its questions use those. Setup will walk them from the
# bottom (builder G1) and the Plan page shows them with the ladder; nothing sets a level from
# them (ADR-0075).
# `[exercises.loads]` names the steps that take load and what carries the weight ("barbell",
# "dumbbells", "machine", or "backpack": a vest or backpack, its kg the weight added): each set
# records its kg, and the kit gives the increment (ADR-0072).
# `[exercises.levels]` gives every step who it is for, 1-6 (ADR-0083: 1 Supported, 2 Starting,
# 3 Building, 4 Regular, 5 Strong, 6 Advanced; the top is open, steps added above it stay at 6);
# levels never fall going up a ladder. `[exercises.marks]` lists, for the steps that have any,
# what a step asks of the body: "floor" (lying on it, or getting down to it), "kneeling" (weight
# on a knee), "impact" (jumps or running, every way the step can be done), "hanging" (from a
# bar), "balance" (on one leg, or balance work without a hold), "knees" (deep knee bending,
# every way the step can be done: a loaded or full-depth squat, one leg below chair height, a
# full-range split squat or lunge, a Nordic; not a squat to a chair, a low step or a bike). The
# seed writes both on every run, like cues. `failure_ok = true`: a last set to failure is safe on this exercise: isolation
# and stable ones, plus push-ups and pull-ups, which ADR-0084 names (stopping at the first rep that
# isn't full); never jumps, swings, pistols, Nordics, loaded hinges, carries, neck work, ab
# rollouts or Copenhagen planks. `range = [low, high]` (reps, seconds or minutes a set) is for an
# exercise no session uses yet: the range a session would give it, whose bottom its questions ask
# for; a session item sets its own (ADR-0083).

# Plan versions, oldest first: each is in force from `since` until the next (ADR-0034). Every
# workout records the version in force on its date. Add a version when the plan changes; a
# version's date can't change once workouts record it, its name can.

