# ------------------------------------------------- away, no equipment (ADR-0086)
# Kit-free pulls for the away versions: a hotel room has no bar, bands or bells, but it has a
# door frame. Hold the frame itself, never the door: a solid frame with the door wide open, and
# the knees soft so you can step back under yourself. Each starts at its level-4 step, where a
# person who does the plan's other pulls can begin; the questions find their own.

[[exercises]]
slug = "doorway-row"
name = "Door-frame row"
summary = "In an open doorway, hold the frame on both sides at chest height (the frame, never the door). Walk your feet in, lean back with straight arms and a straight body, then pull your chest to the frame and lower slowly."
kind = "reps"
muscles = { "upper back" = 1, lats = 1, biceps = 0.5, "rear delts" = 0.5 }
pattern = "horizontal pull"
stress = ["grip"]
aliases = ["doorway row", "doorway rows", "door frame row", "door frame rows", "door-frame rows"]
start = 2
ladder = ["Upright, a step back", "Leaning back, half a step in", "Leaning back, feet at the frame", "Feet at the frame, 3 s lowering", "One arm, feet at the frame"]
[exercises.cues]
"Upright, a step back" = "Feet a step back from the frame, leaning back only a little: the lightest pull."
"Leaning back, half a step in" = "Feet half a step in from where you stand upright; the further in, the heavier."
"Leaning back, feet at the frame" = "Toes level with the frame, body straight from heels to head, squeeze your shoulder blades at the top."
"Feet at the frame, 3 s lowering" = "Pull in, then take three seconds to lean back out."
"One arm, feet at the frame" = "One hand on the frame at chest height, the other at your side; keep the shoulders level, no twist."
[exercises.questions]
"Leaning back, half a step in" = "Can you do 8 rows holding a door frame, leaning back with your feet half a step in?"
"Leaning back, feet at the frame" = "Can you do 8 rows holding a door frame, toes level with it, body straight?"
"Feet at the frame, 3 s lowering" = "Can you do 8 rows holding a door frame, toes level with it, taking three seconds to lower?"
"One arm, feet at the frame" = "Can you do 8 one-arm rows holding a door frame on each arm, toes level with it?"
[exercises.levels]
"Upright, a step back" = 2
"Leaning back, half a step in" = 3
"Leaning back, feet at the frame" = 4
"Feet at the frame, 3 s lowering" = 5
"One arm, feet at the frame" = 6

