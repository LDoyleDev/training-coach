[project]
name = "training-coach"
version = "0.18.0"
description = "Self-hosted training coach: Telegram bot, logging and dashboard API"
authors = [{ name = "Liam Doyle" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot[job-queue]>=22.8",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=2.7",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "time-machine>=3.5.1",
]

[project.scripts]
training-coach = "training_coach.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC", "PT", "C4", "DTZ", "T20", "PGH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["training_coach"]

# The dependency map (CLAUDE.md "Architecture rules"), enforced by `lint-imports` in CI.
[tool.importlinter]
root_package = "training_coach"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Adapters -> services -> db -> domain"
type = "layers"
layers = [
    "training_coach.api | training_coach.bot",
    "training_coach.services",
    "training_coach.db",
    "training_coach.domain",
]
ignore_imports = [
    # The API process is the composition root: its lifespan starts the bot.
    "training_coach.api.app -> training_coach.bot.app",
]

[[tool.importlinter.contracts]]
name = "Adapters query the database only through services"
type = "forbidden"
source_modules = ["training_coach.api", "training_coach.bot"]
forbidden_modules = ["training_coach.db.models"]
allow_indirect_imports = true  # going through services is the point

[[tool.importlinter.contracts]]
name = "HTTP to Groq and Telegram goes through services"
type = "forbidden"
source_modules = [
    "training_coach.api",
    "training_coach.bot",
    "training_coach.db",
    "training_coach.domain",
]
# Whole packages only (import-linter rule): urllib.parse and http.HTTPStatus are blocked too.
forbidden_modules = ["httpx", "requests", "aiohttp", "urllib3", "urllib", "http"]
allow_indirect_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient`",
]
addopts = "--strict-markers --cov=training_coach --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["training_coach"]
omit = []
